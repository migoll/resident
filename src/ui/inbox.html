<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resident</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<meta name="theme-color" content="#151517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resident">
<style>
  :root {
    --bg: #151517;
    --panel: rgba(255, 255, 255, 0.05);
    --line: rgba(255, 255, 255, 0.09);
    --text: #f5f5f7;
    --text2: #98989f;
    --accent: #0a84ff;
    --green: #30d158;
    --amber: #ff9f0a;
    --red: #ff453a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1100px 500px at 50% -12%, rgba(94, 92, 230, 0.08), transparent 60%), var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    height: 56px; padding: 0 20px;
    background: rgba(21, 21, 23, 0.72);
    backdrop-filter: blur(22px) saturate(1.5);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
  .glyph {
    width: 24px; height: 24px; border-radius: 7px;
    background: linear-gradient(135deg, #30d158, #0a84ff);
    display: grid; place-items: center; font-size: 12px; color: #fff;
    box-shadow: 0 2px 10px rgba(48, 209, 88, 0.3);
  }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .pulse.cycling { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; transform: scale(1.5); } }
  .sub { color: var(--text2); font-size: 12.5px; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .runbtn {
    border: 0; background: rgba(118, 118, 128, 0.22); color: var(--text);
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 13px; border-radius: 100px; cursor: pointer; transition: background .15s;
  }
  .runbtn:hover { background: rgba(118, 118, 128, 0.36); }

  main { max-width: 880px; margin: 0 auto; padding: 26px 20px 90px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 26px; }
  .chip {
    font-size: 11.5px; font-weight: 500; color: var(--text2);
    background: var(--panel); border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 100px; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip a { color: inherit; text-decoration: none; }
  .chip a:hover { color: var(--accent); }
  .chip .x { cursor: pointer; opacity: 0; transition: opacity .15s, color .15s; font-size: 13px; line-height: 1; }
  .chip:hover .x { opacity: .7; }
  .chip .x:hover { color: var(--red); opacity: 1; }
  .chip.add { cursor: pointer; border-style: dashed; }
  .chip.add:hover { color: var(--accent); border-color: rgba(10, 132, 255, 0.4); }
  .chip input { border: 0; background: transparent; outline: none; color: var(--text); font: inherit; font-size: 11.5px; width: 270px; }

  h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text2); margin: 28px 0 12px; }
  h2 .n { color: var(--text); }

  .empty {
    color: var(--text2); font-size: 13.5px; text-align: center;
    border: 1px dashed var(--line); border-radius: 14px; padding: 26px;
  }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 16px; margin-bottom: 10px;
  }
  .card.alert { border-color: rgba(255, 69, 58, 0.4); }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .score {
    flex: none; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
    padding: 2.5px 8px; border-radius: 100px;
  }
  .score.hi  { background: rgba(255, 69, 58, 0.16);  color: var(--red); }
  .score.mid { background: rgba(255, 159, 10, 0.16); color: var(--amber); }
  .score.lo  { background: rgba(10, 132, 255, 0.16); color: var(--accent); }
  .title { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .tags { margin-left: auto; display: flex; gap: 6px; flex: none; align-items: center; }
  .tag { font-size: 11px; color: var(--text2); background: rgba(118, 118, 128, 0.18); padding: 2.5px 8px; border-radius: 100px; white-space: nowrap; text-decoration: none; }
  a.tag:hover { color: var(--accent); }
  .tag.model { color: var(--accent); background: rgba(10, 132, 255, 0.13); }

  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--text2); font-size: 12.5px; user-select: none; }
  summary:hover { color: var(--text); }
  pre {
    margin: 10px 0 0; padding: 12px; border-radius: 10px;
    background: rgba(0, 0, 0, 0.32); border: 1px solid var(--line);
    font: 11.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap; word-break: break-word;
    max-height: 420px; overflow: auto; color: #d8d8de;
  }
  pre.fix { border-color: rgba(10, 132, 255, 0.25); }
  pre.fix.cmd { border-color: rgba(48, 209, 88, 0.35); color: #7ee787; }
  pre .add { color: #4cd964; }
  pre .del { color: #ff6961; }
  pre .hunk { color: #6fb3ff; }

  .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: 0; font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.subtle { background: rgba(118, 118, 128, 0.22); color: var(--text); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .prlink { font-size: 12.5px; color: var(--green); text-decoration: none; font-weight: 600; }
  .spin {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--accent);
    animation: rot 0.8s linear infinite; display: inline-block; vertical-align: -2px;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  .row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 8px 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 13px;
  }
  .row .when { flex: none; color: var(--text2); font-size: 11.5px; font-variant-numeric: tabular-nums; width: 52px; }
  .row .what { color: var(--text2); }
  .row .what b { color: var(--text); font-weight: 500; }
  .row.dim .what b { color: var(--text2); font-weight: 400; }
  .row.good .what b { color: var(--green); }
  .row .why { margin-left: auto; flex: none; font-size: 11px; color: var(--text2); opacity: 0.7; }
  .row .why a { color: var(--text2); }
  .mini {
    border: 0; background: rgba(118, 118, 128, 0.22); color: var(--text2);
    font: 600 10.5px -apple-system, sans-serif; padding: 2px 9px; border-radius: 100px;
    cursor: pointer; margin-left: 7px; vertical-align: 1px;
  }
  .mini:hover { color: var(--text); background: rgba(118, 118, 128, 0.34); }

  footer { text-align: center; color: var(--text2); font-size: 12px; padding: 30px 0 14px; opacity: 0.7; }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="glyph">☉</span>Resident</div>
    <span class="pulse" id="pulse"></span>
    <span class="sub" id="watchline">waking…</span>
    <div class="right">
      <span class="sub" id="budget"></span>
      <span class="sub" id="next"></span>
      <button class="runbtn" id="runnow">Run a cycle now</button>
    </div>
  </header>

  <main>
    <div class="chips" id="chips"></div>

    <h2>Ready for you · <span class="n" id="nready">0</span></h2>
    <div id="ready"></div>

    <h2>Activity</h2>
    <div id="activity"></div>

    <footer>shadow mode — Resident only writes when you approve · config in ~/.resident/config.json</footer>
  </main>

<script>
  const $ = (s) => document.querySelector(s)
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  let state = null
  let nextAt = 0

  function ago(ts) {
    const s = Math.max(0, (Date.now() - ts) / 1000)
    if (s < 60) return 'now'
    if (s < 3600) return Math.floor(s / 60) + 'm'
    if (s < 86400) return Math.floor(s / 3600) + 'h'
    return Math.floor(s / 86400) + 'd'
  }

  function diffHtml(text) {
    return esc(text).split('\n').map((l) => {
      if (l.startsWith('+')) return '<span class="add">' + l + '</span>'
      if (l.startsWith('-')) return '<span class="del">' + l + '</span>'
      if (l.startsWith('@@')) return '<span class="hunk">' + l + '</span>'
      return l
    }).join('\n')
  }

  function scoreCls(s) { return s >= 80 ? 'hi' : s >= 60 ? 'mid' : 'lo' }

  function card(i) {
    const ru = (state && state.repoUrls && state.repoUrls[i.repo]) || null
    let actions = ''
    if (i.status === 'ready') {
      actions = '<div class="actions">'
        + (i.patch ? '<button class="btn primary" onclick="act(' + i.id + ',\'approve\')">Approve → branch + PR</button>'
            : i.command ? (i.commandAllowed
                ? '<button class="btn primary" onclick="act(' + i.id + ',\'approve\')">Approve → run + PR</button>'
                : '<span class="sub">command not in this repo’s allowlist — add it to repos[].commands in ~/.resident/config.json to enable one-click run</span>')
            : '')
        + (ru && i.repo ? '<button class="btn subtle" onclick="act(' + i.id + ',\'issue\')">Open issue instead</button>' : '')
        + (i.repo ? '<button class="btn subtle" onclick="act(' + i.id + ',\'reinvestigate\')" title="requeues for a fresh investigation — costs one budget unit">Re-investigate</button>' : '')
        + '<button class="btn subtle" onclick="act(' + i.id + ',\'dismiss\')">Dismiss</button>'
        + (i.cost ? '<span class="sub">$' + i.cost.toFixed(2) + '</span>' : '')
        + (i.reason ? '<span class="sub">' + esc(i.reason) + '</span>' : '')
        + '</div>'
    } else if (i.status === 'approving') {
      actions = '<div class="actions"><span class="spin"></span><span class="sub">applying fix on a worktree branch, opening PR…</span></div>'
    } else if (i.status === 'working') {
      actions = '<div class="actions"><span class="spin"></span><span class="sub">opening issue…</span></div>'
    } else if (i.status === 'approved' || i.status === 'tracked') {
      const what = i.status === 'tracked' ? 'Issue opened' : 'PR opened — merge it when ready'
      actions = '<div class="actions">' + (i.pr_url && i.pr_url.startsWith('http')
        ? '<a class="prlink" href="' + esc(i.pr_url) + '" target="_blank">✓ ' + what + ' ↗</a>'
        : '<span class="prlink">✓ ' + esc(i.pr_url ?? 'done') + '</span>') + '</div>'
    }

    let ev = i.evidence
    let fixBlock = ''
    if (ev && i.patch) {
      ev = ev.replace(/```diff\n[\s\S]*?```/, '↓ proposed fix shown below')
      fixBlock = '<pre class="fix">' + diffHtml(i.patch) + '</pre>'
    } else if (ev && i.command) {
      ev = ev.replace(/```(?:sh|bash|shell)\n[\s\S]*?```/, '↓ proposed command shown below')
      fixBlock = '<pre class="fix cmd">$ ' + esc(i.command) + '</pre>'
    }
    const hasFix = i.patch || i.command
    const body = ev
      ? '<details' + (hasFix ? ' open' : '') + '><summary>Evidence' + (i.patch ? ' + proposed fix' : i.command ? ' + proposed command' : '') + '</summary><pre>' + esc(ev) + '</pre>' + fixBlock + '</details>'
      : (i.detail ? '<details' + (i.sense === 'self' ? ' open' : '') + '><summary>Detail</summary><pre>' + esc(i.detail) + '</pre></details>' : '')

    const repoTag = i.repo
      ? (ru ? '<a class="tag" target="_blank" href="' + esc(ru) + '">' + esc(i.repo) + ' ↗</a>' : '<span class="tag">' + esc(i.repo) + '</span>')
      : '<span class="tag">alert</span>'

    return '<div class="card' + (i.sense === 'self' ? ' alert' : '') + '">'
      + '<div class="top"><span class="score ' + scoreCls(i.score) + '">' + i.score + '</span>'
      + '<span class="title">' + esc(i.title) + '</span>'
      + '<span class="tags">' + repoTag
      + '<span class="tag">' + esc(i.sense + '/' + i.kind) + '</span>'
      + (i.model ? '<span class="tag model" title="model that investigated this finding">' + esc(i.model) + '</span>' : '')
      + (i.status === 'investigating' ? '<span class="tag"><span class="spin"></span></span>' : '')
      + '</span></div>'
      + body + actions
      + '</div>'
  }

  function row(i) {
    const labels = {
      ignored: 'noted, below threshold', dismissed: 'dismissed by you',
      queued: 'queued for investigation', failed: 'failed', investigating: 'investigating now',
      merged: 'PR merged', closed: 'closed',
    }
    const mini = i.status === 'dismissed'
      ? ' <button class="mini" onclick="act(' + i.id + ',\'restore\')">restore</button>'
      : i.status === 'failed'
        ? ' <button class="mini" onclick="act(' + i.id + ',\'restore\')">retry</button>'
        : ''
    const why = (i.status === 'merged' || i.status === 'closed') && i.pr_url && i.pr_url.startsWith('http')
      ? '<a href="' + esc(i.pr_url) + '" target="_blank">' + esc(i.reason ?? labels[i.status]) + ' ↗</a>'
      : esc(i.reason ?? labels[i.status] ?? i.status) + ' · ' + i.score
    return '<div class="row' + (i.status === 'ignored' || i.status === 'dismissed' ? ' dim' : '') + (i.status === 'merged' ? ' good' : '') + '">'
      + '<span class="when">' + ago(i.updated) + '</span>'
      + '<span class="what"><b>' + esc(i.title) + '</b>' + (i.repo ? ' · ' + esc(i.repo) : '') + mini + '</span>'
      + '<span class="why">' + why + '</span>'
      + '</div>'
  }

  async function act(id, what) {
    await fetch('/api/item/' + id + '/' + what, { method: 'POST' })
    refresh()
  }
  window.act = act

  // ---- watchlist editing
  let adding = false
  function renderChips() {
    const chip = (label, href, key) =>
      '<span class="chip">' + (href ? '<a target="_blank" href="' + esc(href) + '">' + esc(label) + ' ↗</a>' : esc(label))
      + '<span class="x" data-k="' + esc(key) + '" title="stop watching">×</span></span>'
    $('#chips').innerHTML = state.watching.repos.map((r) => chip(r, state.repoUrls && state.repoUrls[r], r)).join('')
      + state.watching.urls.map((u) => chip('🌐 ' + u.replace(/^https?:\/\//, ''), u, u)).join('')
      + '<span class="chip add" id="addChip">＋ watch repo or url</span>'
  }
  async function sendWatch(body) {
    const r = await fetch('/api/watch', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    return r.json()
  }
  document.addEventListener('click', async (e) => {
    const x = e.target.closest('.chip .x')
    if (x) { await sendWatch({ remove: x.dataset.k }); refresh(); return }
    const add = e.target.closest('#addChip')
    if (add && !adding) {
      adding = true
      add.classList.remove('add')
      add.innerHTML = '<input placeholder="/path/to/repo or https://site.com" spellcheck="false">'
      const inp = add.querySelector('input')
      inp.focus()
      inp.addEventListener('keydown', async (ev) => {
        if (ev.key === 'Escape') { adding = false; renderChips(); return }
        if (ev.key !== 'Enter') return
        ev.preventDefault()
        const v = inp.value.trim()
        if (!v) return
        const j = await sendWatch({ add: v })
        if (j.ok) { adding = false; refresh() }
        else { inp.value = ''; inp.placeholder = j.error || 'failed — try again' }
      })
    }
  })

  async function refresh() {
    try {
      state = await (await fetch('/api/state')).json()
    } catch { return }
    nextAt = state.nextCycleAt

    $('#pulse').classList.toggle('cycling', state.cycling)
    $('#watchline').textContent = state.cycling
      ? 'cycle running…'
      : 'watching ' + state.watching.repos.length + ' repos · ' + state.watching.urls.length + ' site' + (state.watching.urls.length === 1 ? '' : 's')
    $('#budget').textContent = state.usedToday + '/' + state.budgets.perDay + ' investigations today'
      + (state.costToday ? ' · $' + state.costToday.toFixed(2) + ' AI usage (investigations + approvals)' : '')

    if (!adding) renderChips()

    const items = state.items
    const front = items.filter((i) => ['ready', 'investigating', 'approving', 'working', 'approved', 'tracked'].includes(i.status))
    const rest = items.filter((i) => ['ignored', 'dismissed', 'queued', 'failed', 'merged', 'closed'].includes(i.status)).slice(0, 40)

    $('#nready').textContent = front.filter((i) => i.status === 'ready').length
    $('#ready').innerHTML = front.length ? front.map(card).join('') : '<div class="empty">Quiet. Nothing needs you.</div>'
    $('#activity').innerHTML = rest.length ? rest.map(row).join('') : '<div class="empty">No activity yet — first cycle coming up.</div>'
  }

  $('#runnow').addEventListener('click', async () => {
    await fetch('/api/cycle', { method: 'POST' })
    setTimeout(refresh, 400)
  })

  setInterval(() => {
    if (!nextAt) return
    const s = Math.max(0, Math.round((nextAt - Date.now()) / 1000))
    $('#next').textContent = state && state.cycling ? '' : 'next cycle ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
  }, 1000)

  refresh()
  setInterval(refresh, 4000)
</script>
</body>
</html>
